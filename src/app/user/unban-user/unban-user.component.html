<div class="container mt-4">
    <button (click)="goBack()" class="btn btn-outline-secondary mb-4">
      <i class="fas fa-arrow-left me-2"></i>Retour
    </button>
  
    <div class="card">
      <div class="card-body">
        <div *ngIf="!unbanSuccess; else successView">
          <h2 class="card-title mb-4">Débannir l'utilisateur #{{ userId }}</h2>
          <p class="mb-4">Êtes-vous sûr de vouloir débannir cet utilisateur ?</p>
          
          <div class="form-group mb-4">
            <label class="form-label">Raison du débannissement (optionnel)</label>
            <textarea [(ngModel)]="unbanReason" class="form-control" rows="3" 
                      placeholder="Pourquoi débannir cet utilisateur ?"></textarea>
          </div>
          
          <div class="d-flex gap-2">
            <button (click)="goBack()" class="btn btn-outline-secondary">
              Annuler
            </button>
            <button (click)="submitUnban()" class="btn btn-success" [disabled]="isLoading">
              <span *ngIf="!isLoading">Confirmer le débannissement</span>
              <span *ngIf="isLoading">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Traitement...
              </span>
            </button>
          </div>
        </div>
  
        <ng-template #successView>
          <div class="text-center">
            <div class="mb-3">
              <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
            </div>
            <h3 class="mb-4">Utilisateur débanni avec succès</h3>
            <p class="mb-4">{{ resultMessage }}</p>
            <button (click)="goBack()" class="btn btn-primary">
              <i class="fas fa-arrow-left me-2"></i>Retour
            </button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
