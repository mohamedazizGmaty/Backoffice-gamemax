<section class="py-0">
  <div class="container-small">
    <nav class="mb-3" aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="/marketplace">Marketplace</a></li>
        <li class="breadcrumb-item active" aria-current="page">Game details</li>
      </ol>
    </nav>
    <div class="row g-5 mb-5 mb-lg-8" data-product-details="data-product-details">
      <div class="col-12 col-lg-6">
        <div class="row g-3 mb-3">


          <div
            class="carousel slide theme-slider text-center carousel-fade w-100 h-0 d-flex align-items-center border border-translucent rounded-3 p-3"
            id="controlStyledExample"
            data-bs-ride="carousel"
            style="height: 400px;">
            <div class="carousel-indicators">
              <button *ngFor="let image of article.game.imageUrls; let i = index"
                      [class.active]="i === 0"
                      type="button"
                      [attr.data-bs-target]="'#controlStyledExample'"
                      [attr.data-bs-slide-to]="i"
                      [attr.aria-label]="'Slide ' + (i + 1)">
              </button>
            </div>
            <div class="carousel-inner rounded">
              <div *ngFor="let image of article.game.imageUrls; let i = index"
                   class="carousel-item"
                   [class.active]="i === 0">
                <img class="d-block w-100" [src]="'http://localhost:8080' + image" alt="Game image"
                     style="height: 100%; object-fit: cover;"/>
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#controlStyledExample"
                    data-bs-slide="prev">
              <span class="fas fa-angle-left"></span>
              <span class="sr-only">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#controlStyledExample"
                    data-bs-slide="next">
              <span class="fas fa-angle-right"></span>
              <span class="sr-only">Next</span>
            </button>
          </div>


        </div>
        <div class="d-flex">
          <button class="btn btn-lg btn-outline-warning rounded-pill w-100 me-3 px-2 px-sm-4 fs-9 fs-sm-8" (click)="enablePriceUpdate()"><span
            class="me-2 fas fa-pen"></span>Update Price
          </button>
          <button class="btn btn-lg btn-warning rounded-pill w-100 fs-9 fs-sm-8" (click)="deleteArticle()" ><span
            class="fas fa-trash me-2"></span>Delete Game
          </button>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="d-flex flex-column justify-content-between h-100">
          <div>
            <div class="d-flex flex-wrap">
              <p class="text-primary fw-semibold mb-2">{{ article.numberOfSold }} People bought this game </p>
            </div>
            <h3 class="mb-3 lh-sm">{{ article.game.gameName }}</h3>

            <div class="d-flex flex-wrap align-items-center">
              <h2 *ngIf="!priceUpdated" class="me-3 mb-3">${{ article.price }}</h2>
              <input *ngIf="priceUpdated" class="form-control mb-3 me-3" id="price" type="number"
                     [value]="article.price" style="width: 150px" required>
              <button *ngIf="priceUpdated" class="btn btn-primary me-3 mb-3" type="button" style="width: 100px; height: 40px" (click)="updatePrice()">Update</button>
              <a *ngIf="priceUpdated" class="fw-semibold" (click)="disablePriceUpdate()"  style="cursor: pointer">Cancel</a>
            </div>


            <p class="mb-2 text-body-secondary mb-3">creation date
              : {{ article.creationDate | date: 'dd,MMMM yyyy' }}</p>
            <p class="mb-2 text-body-secondary mb-3">{{ article.game.gameDescription }}</p>

            <div class="d-flex flex-wrap align-items-start mb-3"><a class="fw-semibold" href="/games">View Game details
              ></a></div>
          </div>
        </div>
      </div>
    </div>
  </div><!-- end of .container-->
</section>
