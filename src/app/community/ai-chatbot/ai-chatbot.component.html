<div class="chat-box p-3 border rounded" style="max-width: 500px; margin: auto;">
    <h5>💬 Assistant IA</h5>
  
    <div class="messages" style="max-height: 300px; overflow-y: auto;">
      <div *ngFor="let msg of messages" [class.text-end]="msg.from === 'user'">
        <span class="badge bg-{{msg.from === 'user' ? 'primary' : 'secondary'}} m-1">
          {{ msg.text }}
        </span>
      </div>
    </div>
  
    <div class="d-flex mt-3">
      <input [(ngModel)]="userMessage" class="form-control me-2" placeholder="Pose une question..." />
      <button class="btn btn-success" (click)="sendMessage()">Envoyer</button>
    </div>
  </div>
